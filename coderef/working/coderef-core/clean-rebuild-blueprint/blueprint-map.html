<!DOCTYPE html>
<!--
  coderef map viewer — native CodeRef clean rebuild blueprint map
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>coderef map — Clean Rebuild Target Blueprint</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --panel-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-bright: #f0f6fc;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-purple: #bc8cff;
      --accent-orange: #d29922;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-tag {
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(88, 166, 255, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-bright);
    }

    .stats-bar {
      display: flex;
      gap: 1.25rem;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .stat-val {
      color: var(--accent-blue);
      font-weight: 600;
    }

    #app-container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #sidebar {
      width: 340px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 5;
      overflow-y: auto;
    }

    .sidebar-section {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-section h2 {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b949e;
      margin-bottom: 0.75rem;
    }

    .node-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .node-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .node-item:hover {
      border-color: var(--accent-blue);
      background: rgba(88, 166, 255, 0.08);
    }

    .node-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-bright);
    }

    .node-layer {
      font-size: 0.75rem;
      color: #8b949e;
    }

    #viewport {
      flex: 1;
      background: #090d13;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .node-rect {
      rx: 8; ry: 8;
      stroke-width: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .node-rect:hover {
      filter: drop-shadow(0 0 10px rgba(88, 166, 255, 0.5));
    }

    .node-text {
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 600;
      fill: #f0f6fc;
      pointer-events: none;
    }

    .node-subtext {
      font-family: var(--font-code);
      font-size: 11px;
      fill: #8b949e;
      pointer-events: none;
    }

    .edge-line {
      stroke: #30363d;
      stroke-width: 2px;
      fill: none;
      marker-end: url(#arrow);
    }
  </style>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-tag">Clean Blueprint Map</span>
      <h1>coderef-core — Target Architecture Dependency Graph</h1>
    </div>
    <div class="stats-bar">
      <div>Layers: <span class="stat-val">6</span></div>
      <div>Modules: <span class="stat-val">17</span></div>
      <div>Edges: <span class="stat-val">17</span></div>
      <div>Resolution: <span class="stat-val">100% Exact</span></div>
    </div>
  </header>

  <div id="app-container">
    <div id="sidebar">
      <div class="sidebar-section">
        <h2>Target Layers & Modules</h2>
        <div class="node-list" id="module-list"></div>
      </div>
    </div>

    <div id="viewport">
      <svg id="graph-svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
          </marker>
        </defs>
        <g id="graph-group"></g>
      </svg>
    </div>
  </div>

  <script>
    const mapData = {
      nodes: [
        { id: "cli", label: "CLI Runner Suite", layer: "Presentation (L6)", color: "#bc8cff", x: 100, y: 80, sub: "@adapters/cli/* (18 bins)" },
        { id: "mcp", label: "MCP Tool Adapters", layer: "Presentation (L6)", color: "#bc8cff", x: 500, y: 80, sub: "@adapters/mcp/* (36+ tools)" },
        
        { id: "query", label: "QueryService Facade", layer: "Service (L5)", color: "#58a6ff", x: 200, y: 220, sub: "@application/services/query-service" },
        { id: "executor", label: "Pipeline Phase Executor", layer: "Service (L5)", color: "#58a6ff", x: 550, y: 220, sub: "@application/pipeline/executor" },
        
        { id: "p_discover", label: "01. FileDiscoveryPhase", layer: "Middleware (L4)", color: "#3fb950", x: 100, y: 380, sub: "Phase 1" },
        { id: "p_scan", label: "03. ASTElementScanPhase", layer: "Middleware (L4)", color: "#3fb950", x: 300, y: 380, sub: "Phase 3" },
        { id: "p_call", label: "05. ScopeCallResolution", layer: "Middleware (L4)", color: "#3fb950", x: 500, y: 380, sub: "Phase 5" },
        { id: "p_graph", label: "08. CanonicalGraphEmit", layer: "Middleware (L4)", color: "#3fb950", x: 700, y: 380, sub: "Phase 8" },
        
        { id: "graph_engine", label: "Canonical Graph Engine", layer: "Domain (L3)", color: "#d29922", x: 200, y: 540, sub: "@domain/graph/canonical-graph" },
        { id: "symbol_table", label: "Global Symbol Table", layer: "Domain (L3)", color: "#d29922", x: 550, y: 540, sub: "@domain/symbol/symbol-table" },
        
        { id: "bm25", label: "BM25 Sub-Token N-Gram", layer: "Search (L2)", color: "#f0883e", x: 150, y: 680, sub: "@infrastructure/search/sparse-bm25" },
        { id: "vector", label: "Ollama Vector Store", layer: "Search (L2)", color: "#f0883e", x: 450, y: 680, sub: "@infrastructure/search/vector-store" },
        
        { id: "parser", label: "Tree-Sitter Parser Substrate", layer: "Parser Core (L1)", color: "#ff7b72", x: 300, y: 820, sub: "@infrastructure/parser/grammar-registry" }
      ],
      edges: [
        { from: "cli", to: "query" },
        { from: "cli", to: "executor" },
        { from: "mcp", to: "query" },
        { from: "executor", to: "p_discover" },
        { from: "executor", to: "p_scan" },
        { from: "executor", to: "p_call" },
        { from: "executor", to: "p_graph" },
        { from: "p_scan", to: "parser" },
        { from: "p_call", to: "symbol_table" },
        { from: "p_graph", to: "graph_engine" },
        { from: "query", to: "graph_engine" },
        { from: "query", to: "bm25" },
        { from: "query", to: "vector" }
      ]
    };

    // Render Sidebar List
    const listEl = document.getElementById('module-list');
    mapData.nodes.forEach(n => {
      const item = document.createElement('div');
      item.className = 'node-item';
      item.innerHTML = `<div class="node-name">${n.label}</div><div class="node-layer">${n.layer} • ${n.sub}</div>`;
      listEl.appendChild(item);
    });

    // Render D3 SVG Graph
    const svg = d3.select('#graph-svg');
    const g = d3.select('#graph-group');

    // Draw Edges
    mapData.edges.forEach(e => {
      const source = mapData.nodes.find(n => n.id === e.from);
      const target = mapData.nodes.find(n => n.id === e.to);
      if (source && target) {
        g.append('line')
          .attr('class', 'edge-line')
          .attr('x1', source.x + 90)
          .attr('y1', source.y + 25)
          .attr('x2', target.x + 90)
          .attr('y2', target.y + 25);
      }
    });

    // Draw Nodes
    const nodeGroups = g.selectAll('.node-g')
      .data(mapData.nodes)
      .enter()
      .append('g')
      .attr('transform', d => `translate(${d.x}, ${d.y})`);

    nodeGroups.append('rect')
      .attr('class', 'node-rect')
      .attr('width', 180)
      .attr('height', 50)
      .attr('fill', '#161b22')
      .attr('stroke', d => d.color);

    nodeGroups.append('text')
      .attr('class', 'node-text')
      .attr('x', 10)
      .attr('y', 22)
      .text(d => d.label);

    nodeGroups.append('text')
      .attr('class', 'node-subtext')
      .attr('x', 10)
      .attr('y', 38)
      .text(d => d.sub);

    // Zoom & Pan
    const zoom = d3.zoom().on('zoom', (event) => {
      g.attr('transform', event.transform);
    });
    svg.call(zoom);
  </script>
</body>
</html>
